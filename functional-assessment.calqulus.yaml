
- template: templates/skeleton-mapping.calqulus.yaml

- template: templates/fa/cmj.calqulus.yaml
  where:
    name: CMJ*

- template: templates/fa/dj.calqulus.yaml
  where:
    name: DJ*

- template: templates/fa/cutting.calqulus.yaml
  where:
    name: Cut*

- template: templates/fa/cod.calqulus.yaml
  where:
    name: COD*

- template: templates/fa/sj.calqulus.yaml
  where:
    name: SJ*

- template: templates/fa/acc.calqulus.yaml
  where:
    name: Acc*

- template: templates/fa/sl.calqulus.yaml
  where:
    name: ^(SLCDL|SLJ|SLL)*

- template: templates/fa/pj.calqulus.yaml
  where:
    name: PJ*

- template: templates/fa/sh.calqulus.yaml
  where:
    name: SH*

- template: templates/fa/tapping.calqulus.yaml
  where:
    name: Tap*

- template: templates/fa/ll.calqulus.yaml
  where:
    name: ^LL*

- template: templates/fa/squatting.calqulus.yaml
  where:
    name: Squat*

- template: templates/fa/lunge.calqulus.yaml
  where:
    name: Lunge*

# Test-only: this repository treats Generic measurements as bilateral Hop 10.
- template: templates/fa/hop10.calqulus.yaml
  where:
    name: ^(HOP10|Generic).*

- template: templates/running/running.calqulus.yaml
  where:
    name: ^(Gait|Run|Walk)*

- template: templates/fa/balance.calqulus.yaml
  where:
    name: ^(Balance|Y Balance)*
    # force: any # Balance session requires force plates presence

# Body weight (applies to all tasks)
- parameter: MASS
  steps:
    - import: $bodyMass

- parameter: Measurement_Duration
  steps:
    - divide: [$length, $framerate]

# HOP 10 REPORT CENTER TEST NOTES
# Changed from the current GitHub main version of this file, not the older local copy.
# The two Generic template imports were replaced by one Hop 10 import.
# The route matches measurement names beginning HOP10 or Generic.
# This test repository assumes every Generic measurement routed here is a
# bilateral Hop 10 trial. Do not use this route for other Generic movements.
# templates/fa/hop10.calqulus.yaml must also be uploaded from this package:
# its Generic matches select the bilateral (B) calculation blocks.
# Report Center Repository must point to JasonXu-BRC/New-Calqulus1.git,
# with this root file and the matching Hop 10 template on the selected branch.
# This is routing only. Calqulus compilation and event detection remain untested.

